<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="One cable loop gives 2:1 at the handle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5">
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1a1a1a">One cable loop gives 2:1 at the handle</text>
  <text x="24" y="48" font-size="11.5" fill="#5f6368">Side view of one side of the rack. The rear trolley hangs in a loop of the cable.</text>
  <g stroke="#e3e3e3" stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="76" x2="170" y2="516"/><line x1="576" y1="76" x2="576" y2="516"/>
    <line x1="170" y1="76" x2="576" y2="76"/><line x1="170" y1="516" x2="576" y2="516"/>
  </g>
  <g fill="none" stroke="#1f6fd1" stroke-width="2">
    <polyline points="690,356 548,318 548,92 196,92 200,318"/>
    <polyline points="228,318 248,132 262,492 520,492 520,362"/>
  </g>
  <rect x="176" y="290" width="60" height="22" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <circle cx="214" cy="318" r="14" fill="#1f6fd1" fill-opacity="0.25" stroke="#1f6fd1" stroke-width="2"/>
  <text x="24" y="300" font-weight="600" fill="#1a1a1a">Rear trolley</text>
  <text x="24" y="316" font-size="11.5" fill="#5f6368">plates + pulley</text>
  <g fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.25">
    <circle cx="196" cy="92" r="14"/><circle cx="548" cy="92" r="14"/>
    <circle cx="248" cy="132" r="11"/><circle cx="262" cy="492" r="11"/><circle cx="520" cy="492" r="11"/>
    <circle cx="548" cy="318" r="11"/>
  </g>
  <text x="196" y="66" text-anchor="middle" fill="#1a1a1a">Pulley B (rear top)</text>
  <text x="548" y="66" text-anchor="middle" fill="#1a1a1a">Pulley A (front top)</text>
  <text x="266" y="136" fill="#1a1a1a">Pulley 1 (under top crossmember)</text>
  <text x="262" y="540" text-anchor="middle" fill="#1a1a1a">Pulley 2 (bottom, rear)</text>
  <text x="520" y="540" text-anchor="middle" fill="#1a1a1a">Pulley 3 (bottom, front)</text>
  <rect x="524" y="300" width="48" height="72" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <circle cx="520" cy="362" r="5" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <text x="592" y="298" font-weight="600" fill="#1a1a1a">Front trolley</text>
  <text x="592" y="314" font-size="11.5" fill="#5f6368">double pulley head</text>
  <text x="508" y="366" text-anchor="end" font-size="11.5" fill="#5f6368">eye bolt = cable end</text>
  <rect x="686" y="352" width="40" height="10" rx="4" fill="#1a1a1a"/>
  <text x="710" y="344" text-anchor="middle" fill="#1a1a1a">Handle</text>
  <text x="170" y="572" text-anchor="middle" font-size="11.5" fill="#5f6368">Middle upright</text>
  <text x="576" y="572" text-anchor="middle" font-size="11.5" fill="#5f6368">Front upright</text>
  <text x="300" y="300" font-size="11.5" fill="#5f6368">Two strands hold the rear trolley,</text>
  <text x="300" y="316" font-size="11.5" fill="#5f6368">so each carries half the plates: 2:1</text>
  <text x="300" y="412" font-size="11.5" fill="#5f6368">Move the front trolley: the top run</text>
  <text x="300" y="428" font-size="11.5" fill="#5f6368">and bottom run change by the same</text>
  <text x="300" y="444" font-size="11.5" fill="#5f6368">amount, so the cable stays tight</text>
</svg>
