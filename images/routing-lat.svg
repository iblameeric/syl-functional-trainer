<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-label="Lat pulldown side: 2:1 loop plus a 1:1 lat cable through a floating pulley" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5">
  <rect width="760" height="730" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1a1a1a">Lat pulldown side: 2:1 handle loop plus a 1:1 lat cable</text>
  <text x="24" y="48" font-size="11.5" fill="#5f6368">Side view of the lat side only. Blue = the same loop as the other side. Orange = the lat cable.</text>
  <g transform="translate(0,40)">
  <!-- rack -->
  <g stroke="#e3e3e3" stroke-width="6" stroke-linecap="round">
    <line x1="170" y1="76" x2="170" y2="516"/><line x1="576" y1="76" x2="576" y2="516"/>
    <line x1="170" y1="76" x2="576" y2="76"/><line x1="170" y1="516" x2="576" y2="516"/>
  </g>
  <!-- lat arm -->
  <line x1="576" y1="80" x2="690" y2="64" stroke="#c4c7c5" stroke-width="5" stroke-linecap="round"/>
  <!-- loop (blue) -->
  <g fill="none" stroke="#1f6fd1" stroke-width="2">
    <polyline points="690,396 548,318 548,92 196,92 200,318"/>
    <polyline points="228,318 248,132 336,492 380,412 424,492 520,492 520,362"/>
  </g>
  <!-- lat cable (orange) -->
  <polyline fill="none" stroke="#d9730d" stroke-width="2.5" points="690,226 690,64 548,80 380,50 380,398"/>
  <!-- rear trolley -->
  <rect x="176" y="290" width="60" height="22" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <circle cx="214" cy="318" r="14" fill="#1f6fd1" fill-opacity="0.25" stroke="#1f6fd1" stroke-width="2"/>
  <text x="24" y="300" font-weight="600" fill="#1a1a1a">Rear trolley</text>
  <text x="24" y="316" font-size="11.5" fill="#5f6368">plates + pulley</text>
  <!-- pulleys -->
  <g fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.25">
    <circle cx="196" cy="92" r="14"/>
    <circle cx="248" cy="132" r="11"/><circle cx="336" cy="492" r="11"/><circle cx="424" cy="492" r="11"/><circle cx="520" cy="492" r="11"/>
    <circle cx="548" cy="318" r="11"/>
    <circle cx="380" cy="62" r="12"/>
    <circle cx="690" cy="64" r="10"/>
  </g>
  <!-- double Pulley A -->
  <circle cx="548" cy="92" r="14" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.25"/>
  <circle cx="548" cy="92" r="9" fill="none" stroke="#d9730d" stroke-width="1.5"/>
  <!-- floating pulley -->
  <circle cx="380" cy="412" r="13" fill="#d9730d" fill-opacity="0.2" stroke="#d9730d" stroke-width="2"/>
  <line x1="380" y1="398" x2="380" y2="392" stroke="#d9730d" stroke-width="3"/>
  <!-- labels -->
  <text x="196" y="66" text-anchor="middle" fill="#1a1a1a">Pulley B (rear top)</text>
  <text x="392" y="40" text-anchor="start" fill="#1a1a1a" font-size="11.5">2nd Pulley B (on top crossmember)</text>
  <text x="538" y="126" text-anchor="end" fill="#1a1a1a" font-size="11.5">Double Pulley A</text>
  <text x="690" y="44" text-anchor="middle" fill="#1a1a1a" font-size="11.5">Lat arm tip pulley</text>
  <text x="258" y="150" fill="#1a1a1a" font-size="11.5">Pulley 1</text>
  <text x="394" y="408" fill="#1a1a1a" font-weight="600">Floating pulley</text>
  <text x="394" y="424" font-size="11.5" fill="#5f6368">lat cable on top</text>
  <text x="336" y="530" text-anchor="middle" fill="#1a1a1a" font-size="11.5">Pulley 2a</text>
  <text x="424" y="530" text-anchor="middle" fill="#1a1a1a" font-size="11.5">Pulley 2b</text>
  <text x="520" y="530" text-anchor="middle" fill="#1a1a1a" font-size="11.5">Pulley 3</text>
  <!-- front trolley -->
  <rect x="524" y="300" width="48" height="72" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.25"/>
  <circle cx="520" cy="362" r="5" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <text x="592" y="298" font-weight="600" fill="#1a1a1a">Front trolley</text>
  <text x="592" y="314" font-size="11.5" fill="#5f6368">double pulley head</text>
  <rect x="686" y="392" width="40" height="10" rx="4" fill="#1a1a1a"/>
  <text x="706" y="420" text-anchor="middle" fill="#1a1a1a">Handle (2:1)</text>
  <rect x="650" y="226" width="80" height="8" rx="4" fill="#d9730d"/>
  <text x="690" y="252" text-anchor="middle" fill="#1a1a1a">Lat bar (1:1)</text>
  <text x="170" y="572" text-anchor="middle" font-size="11.5" fill="#5f6368">Middle upright</text>
  <text x="576" y="572" text-anchor="middle" font-size="11.5" fill="#5f6368">Front upright</text>
  <!-- notes -->
  <text x="24" y="612" font-size="11.5" fill="#1a1a1a" font-weight="600">How the lat stays 1:1</text>
  <text x="24" y="630" font-size="11.5" fill="#5f6368">The loop dips from pulley 2a up around the floating pulley and back down to 2b, so two loop strands hold it up.</text>
  <text x="24" y="646" font-size="11.5" fill="#5f6368">Pulling the lat bar lifts the floating pulley, which takes up 2 units of loop for every 1 unit of lat cable. That</text>
  <text x="24" y="662" font-size="11.5" fill="#5f6368">lifts the rear trolley 1 unit per unit pulled, so the bar feels the full plate weight. The handle still works at 2:1.</text>
  </g>
</svg>
